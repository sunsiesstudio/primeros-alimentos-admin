<style>
:root{--bg:#eeead8;--card:#f7f4e8;--ink:#262626;--mute:#6b6a5c;--line:#d8d3bc;--green:#4a8760;--terra:#c96a47;--acc:#3e4cd0;--onacc:#fff;--bar:#4a8760;--bar2:#c96a47;--soft:color-mix(in srgb,var(--green) 12%,var(--card));color-scheme:light}

.disp,h1,h2{font-family:"Luckiest Guy","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;letter-spacing:.03em;margin:0}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

.kpi b{display:block;font:400 2rem/1.1 "Luckiest Guy",system-ui;color:var(--green);letter-spacing:.02em}

.mute{color:var(--mute)}
.ideas{padding-left:0;list-style:none;margin:0}

.center{min-height:72vh;display:grid;place-items:center;text-align:center;padding:20px}
.center .card{max-width:440px;padding:26px 24px}
.center .logo{width:min(360px,90%);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}

.lnk{background:none;border:0;padding:0;color:var(--acc);font:700 14.5px Montserrat,sans-serif;text-align:left;cursor:pointer;text-decoration:underline}

.s1{background:var(--s1);color:var(--s1);stroke:var(--s1);fill:var(--s1)}.s2{background:var(--s2);color:var(--s2);stroke:var(--s2);fill:var(--s2)}

.sb{display:flex;gap:2px;height:16px;border-radius:6px;overflow:hidden}.sb i{display:block;background:var(--s1);min-width:3px}

.dt.nw td{white-space:nowrap}.dt{width:100%;border-collapse:collapse;font-size:13.5px}.dt td,.dt th{padding:8px 6px}.dt .r{text-align:right}.dt small{color:var(--mute)}

@media (max-width:640px){.dt .hm{display:none}.ib{width:50px}.fn{grid-template-columns:90px 1fr 34px 40px}}

<script type="module">

const app=initializeApp({apiKey:"AIzaSyBS8bb9UlOaOCJE92cpWE4nAqIFDuerypQ",authDomain:"primeros-alimentos.firebaseapp.com",projectId:"primeros-alimentos",appId:"1:210048481917:web:f7a4e8f31d067a7152cf14"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MIN=5; // con menos familias no se enseñan porcentajes de un grupo, para que nadie sea identificable

const AGD={gluten:["Avena","Bebida de avena","Cebada","Centeno","Cuscús","Espelta","Harina de trigo","Pan","Pasta","Sémola de trigo"],huevo:["Huevo"],pescado:["Bacalao","Boquerones","Caballa","Dorada","Gallo","Jurel","Lenguado","Lubina","Merluza","Pescadilla","Rape","Rodaballo","Salmón","Sardinas","Trucha"],crustaceos:["Gambas"],moluscos:["Calamar","Mejillones","Pulpo","Sepia"],cacahuete:["Cacahuete"],frutoscascara:["Almendra","Anacardo","Avellana","Macadamia","Nuez","Nuez de Brasil","Nuez pecana","Pistacho"],sesamo:["Sésamo (tahini)"],soja:["Edamame","Tofu","Tempeh","Bebida de soja","Yogur de soja"],apio:["Apio"],legumbres:["Lentejas","Garbanzos","Alubias blancas","Alubias negras","Alubias pintas","Guisantes","Habas tiernas"],lacteos:["Kéfir","Mantequilla","Mozzarella","Queso de cabra","Queso fresco","Queso tierno","Requesón","Ricotta","Yogur griego","Yogur natural"]};
const AGN={gluten:"Gluten",huevo:"Huevo",pescado:"Pescado",crustaceos:"Crustáceos",moluscos:"Moluscos",cacahuete:"Cacahuete",frutoscascara:"Frutos secos",sesamo:"Sésamo",soja:"Soja",apio:"Apio",legumbres:"Legumbres",lacteos:"Lácteos"};
const STY={pure:"Purés",grum:"Purés con grumos",grad:"Poco a poco",blw:"BLW",mix:"Mixto","":"Sin elegir"};
const DAY=864e5,today=new Date().toISOString().slice(0,10);
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/DAY);
const months=(bd,d)=>bd?Math.floor(dd(bd,d)/30.44):null;
const pct=(a,b)=>b?Math.round(a*100/b):0;

/* ---------- pestañas ---------- */
$("nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["uso","bebes","redes","blog"].forEach(k=>$("t-"+k).classList.toggle("hide",k!==t));$("upd").classList.toggle("hide",t==="blog");
  try{localStorage.setItem("adm_tab",t)}catch(e){}};

/* ---------- entrar ---------- */
$("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("err").textContent="No se ha podido entrar: "+e.code);
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  $("login").classList.toggle("hide",!!u);document.body.classList.toggle("out",!u);$("app").classList.toggle("hide",!u);$("nav").classList.toggle("hide",!u);$("out").classList.toggle("hide",!u);$("sp").classList.toggle("hide",!!u);
  if(!u)return;
  $("upd").textContent="Cargando datos…";
  try{const snap=await getDocs(collection(db,"users"));try{render(snap.docs.map(d=>{const x=d.data();return x.fam?{...x,babies:[]}:x}))}catch(re){console.error(re);$("t-uso").innerHTML=`<div class="card">Hay datos con un formato que no esperaba: ${esc(re.message)}</div>`}
    $("upd").textContent=`Datos de ${snap.size} cuentas · ${new Date().toLocaleString("es-ES")} · Lectura de Firestore: ${snap.size} documentos`;}
  catch(e){$("upd").textContent="";$("app").classList.add("hide");$("nav").classList.add("hide");$("login").classList.remove("hide");document.body.classList.add("out");
    $("err").innerHTML=e.code==="permission-denied"?`La cuenta <b>${esc(u.email)}</b> no tiene acceso a los datos. Revisa las reglas de Firestore.`:"Error al leer los datos: "+esc(e.code||e.message);}
  renderBlog();
  try{const t=(location.hash||"").slice(1)||localStorage.getItem("adm_tab");if(t)document.querySelector(`#nav [data-t="${t}"]`)?.click()}catch(e){}
});

/* ---------- piezas de UI ---------- */
const kpi=(v,l,s)=>`<div class="card kpi"><b>${v}</b><span>${l}</span>${s?`<small>${s}</small>`:""}</div>`;
const EMPTY='<p class="mute">Aún no hay datos suficientes.</p>';
const card=(title,note,body,cls="")=>`<div class="card ${cls}"><h2>${title}</h2>${note?`<p class="mute note">${note}</p>`:""}${body}</div>`;
const tip=s=>` data-tip="${esc(s)}"`;
// Cifra grande con variación y mini tendencia
const spark=(vals,cls="s1")=>{if(!vals||vals.length<2)return"";const mx=Math.max(1,...vals),W=120,H=34,st=W/(vals.length-1);
  const pts=vals.map((v,i)=>[i*st,H-3-(v/mx)*(H-8)]);return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(" ")).join("L")}"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3"/></svg>`};
const hero=(v,l,{sub="",delta=null,sp=null,goal=null,ill=""}={})=>{let d="";if(delta!=null&&isFinite(delta)){const up=delta>0,eq=delta===0;d=`<span class="dl ${eq?"":up?"up":"dn"}">${eq?"=":up?"▲":"▼"} ${Math.abs(delta)}${typeof delta==="number"&&String(sub).includes("%")?"":""}</span>`}
  return `<div class="card hero">${ill?`<span class="hill">${ill}</span>`:""}<div class="hl">${l}</div><div class="hv"><b>${v}</b>${d}</div>${goal?`<div class="goal"${tip(`${goal[0]} % · objetivo ${goal[1]} %`)}><i style="width:${Math.min(100,goal[0])}%"></i><u style="left:${goal[1]}%"></u></div>`:""}<small>${sub}</small>${sp?spark(sp):""}</div>`};
// Barras horizontales con tooltip
const hbars=(rows,{c="s1",fmt=null}={})=>{if(!rows.length)return EMPTY;const mx=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="bars">${rows.map(([k,v,lab,t])=>`<div class="row"${tip(t||`${k}: ${lab??v}`)}><span>${esc(k)}</span><span class="tr"><i class="${c}" style="width:${Math.max(1.5,v*100/mx)}%"></i></span><em>${lab??v}</em></div>`).join("")}</div>`};
// Columnas con tooltip
const vcols=(rows,{c="s1",fmt=v=>v,unit=""}={})=>{if(!rows.length||rows.every(r=>!r[1]))return EMPTY;const mx=Math.max(1e-9,...rows.map(r=>r[1]));
  return `<div class="cols">${rows.map(([k,v,t])=>`<div${tip(t||`${k}: ${fmt(v)}${unit}`)}><span>${fmt(v)}</span><i class="${c}" style="height:${Math.max(2,v*120/mx)}px"></i><span>${esc(k)}</span></div>`).join("")}</div>`};
// Línea (una o dos series, mismo eje) con cruceta y tooltip
const lineChart=(xs,series,{pct=false,h=200}={})=>{if(!xs.length)return EMPTY;const W=640,H=h,L=34,R=54,T=12,B=26,mx0=Math.max(1,...series.flatMap(s=>s.v.filter(v=>v!=null)));
  const mx=pct?100:Math.ceil(mx0/(mx0>10?5:1))*(mx0>10?5:1),X=i=>L+(xs.length<2?0:i*(W-L-R)/(xs.length-1)),Y=v=>T+(1-v/mx)*(H-T-B);
  let g="";for(let k=0;k<=2;k++){const v=mx*k/2,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"/><text x="${L-6}" y="${y+4}" class="ax" text-anchor="end">${Math.round(v)}${pct?"%":""}</text>`}
  xs.forEach((x,i)=>{if(xs.length<=8||i%Math.ceil(xs.length/6)===0||i===xs.length-1)g+=`<text x="${X(i)}" y="${H-6}" class="ax" text-anchor="middle">${esc(x)}</text>`});
  const paths=series.map(s=>{const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);const last=pts.at(-1),lv=s.v.filter(v=>v!=null).at(-1);
    return `<path class="ln ${s.c}" d="M${pts.map(p=>p.map(n=>n.toFixed(1)).join(" ")).join("L")}"/>${pts.map(p=>`<circle class="dot ${s.c}" cx="${p[0]}" cy="${p[1]}" r="${xs.length>14?0:3}"/>`).join("")}${last?`<circle class="end ${s.c}" cx="${last[0]}" cy="${last[1]}" r="4.5"/><text x="${last[0]+8}" y="${last[1]+4}" class="lbl">${lv}${pct?"%":""}</text>`:""}`}).join("");
  const hits=xs.map((x,i)=>{const w=(W-L-R)/Math.max(1,xs.length-1);return `<rect class="hit" x="${X(i)-w/2}" y="${T}" width="${w}" height="${H-T-B}" data-x="${X(i)}"${tip(x+" · "+series.map(s=>`${s.n}: ${s.v[i]??"—"}${pct?"%":""}`).join(" · "))}/>`}).join("");
  const leg=series.length>1?`<div class="leg">${series.map(s=>`<span><i class="${s.c}"></i>${esc(s.n)}</span>`).join("")}</div>`:"";
  return `${leg}<svg class="lc" viewBox="0 0 ${W} ${H}" role="img">${g}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}"/>${paths}${hits}</svg>`};
// Barra 100 % segmentada (distribución), pasos de un mismo tono + leyenda con cifras
const stack=(label,parts,tot)=>{const ps=parts.filter(p=>p[1]>0);if(!tot||!ps.length)return "";const op=[1,.72,.5,.34,.22,.14];
  return `<div class="stk"><div class="sl">${esc(label)} <small>${tot} bebés</small></div><div class="sb">${ps.map(([k,v],i)=>`<i style="width:${v*100/tot}%;opacity:${op[Math.min(i,5)]}"${tip(`${label} · ${k}: ${v} (${pct(v,tot)} %)`)}></i>`).join("")}</div>
    <div class="sg">${ps.map(([k,v],i)=>`<span><i style="opacity:${op[Math.min(i,5)]}"></i>${esc(k)} <b>${pct(v,tot)} %</b></span>`).join("")}</div></div>`};

const fi=n=>window.foodIco?window.foodIco(n):"";
const gi=g=>{const l=AGD[g]||[];return fi(l.find(x=>window.foodIcoHas&&window.foodIcoHas(x))||l[0]||"")};
const ILL={
baby:`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="25" r="17" fill="#f3c9a8"/><path d="M14 14q10-10 20 0" fill="#7a5230"/><circle cx="18" cy="25" r="2" fill="#3a2a22"/><circle cx="30" cy="25" r="2" fill="#3a2a22"/><path d="M19 32q5 4 10 0" stroke="#3a2a22" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="14" cy="30" r="2.5" fill="#f0a08a" opacity=".7"/><circle cx="34" cy="30" r="2.5" fill="#f0a08a" opacity=".7"/></svg>`,
heart:`<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 42S6 31 6 18c0-6 5-10 10-10 4 0 6.5 2 8 5 1.5-3 4-5 8-5 5 0 10 4 10 10 0 13-18 24-18 24z" fill="#e05a6a"/><path d="M15 14q-4 2-4 6" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/></svg>`,
plate:`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="18" fill="#fffdf6" stroke="#d8d3bc" stroke-width="2"/><circle cx="24" cy="26" r="11" fill="none" stroke="#e8e2cc" stroke-width="2"/><circle cx="20" cy="23" r="4" fill="#f08a2a"/><circle cx="28" cy="28" r="4" fill="#4a8a3c"/><circle cx="25" cy="21" r="3" fill="#e0402a"/></svg>`,
retry:`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="#a7c7a0"/><path d="M16 26a8 8 0 1 0 3-7" stroke="#26402e" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M14 14v7h7" stroke="#26402e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
/* ---------- cálculos y pintado ---------- */
const GOALN={iron:"Hierro",fiber:"Fibra",omega3:"Omega-3",calcium:"Calcio",protein:"Proteína",zinc:"Zinc",vitc:"Vitamina C",alg:"Alérgenos a tiempo",verd:"Más verduras",x100:"100 alimentos",xvar:"Rico y variado"};
const DIETN={om:"De todo",veg:"Vegetariana",vegan:"Vegana",ovo:"Ovolacto",pesc:"Pescetariana"};
const MILKN={pecho:"Pecho",formula:"Fórmula",mixta:"Mixta",vaca:"Leche de vaca",no:"Ya no toma"};
const TAGN={dientes:"Dientes",malito:"Malito",vacuna:"Vacuna",fuera:"Fuera de casa",cansado:"Muy cansado"};
const MLN={desayuno:"Desayuno",comida:"Comida",merienda:"Merienda",cena:"Cena",media:"Media mañana"};
const tally=(arr,key)=>{const o={};arr.forEach(x=>{const k=key(x);if(k!=null&&k!=="")o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const med=a=>{a=[...a].sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};
const monday=d=>{const x=new Date(d+"T12:00");x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};
const LIKE=r=>r==="love"||r==="ok",BAD=r=>r==="meh"||r==="no",RATED=r=>["love","ok","meh","no"].includes(r);

function render(users){
  const babies=[];users.forEach(u=>(u.babies||[]).forEach(b=>babies.push(b)));
  const real=babies.filter(b=>(Array.isArray(b.log)?b.log:[]).some(l=>l&&!l.pre)||(b.nm||"").trim());
  const info=real.map(b=>{const L=(Array.isArray(b.log)?b.log:[]).filter(l=>l&&l.f&&l.d&&!l.pre).sort((a,c)=>a.d<c.d?-1:1);const ds=[...new Set(L.map(l=>l.d))];
    return {b,L,ds,first:ds[0]||null,last:ds.at(-1)||null,foods:new Set(L.map(l=>l.f)),dn:b.dn&&typeof b.dn==="object"?b.dn:{}}});
  const started=info.filter(i=>i.first),N=started.length,LL=started.flatMap(i=>i.L.map(l=>({...l,_i:i})));
  window.__ST={users,real,started,N,LL};

  // ===== USO =====
  const thisW=monday(today),W12=[];for(let k=11;k>=0;k--){const d=new Date(thisW+"T12:00");d.setDate(d.getDate()-7*k);W12.push(d.toISOString().slice(0,10))}
  const actW=W12.map(w=>started.filter(i=>i.ds.some(d=>monday(d)===w)).length),newW=W12.map(w=>started.filter(i=>monday(i.first)===w).length);
  const wl=w=>{const d=new Date(w+"T12:00");return d.getDate()+"/"+(d.getMonth()+1)};
  const act1=actW.at(-1),act0=actW.at(-2),new1=newW.at(-1),new0=newW.at(-2);
  const firstWeekFoods=i=>new Set(i.L.filter(l=>dd(i.first,l.d)<7).map(l=>l.f)).size;
  const elAct=started.filter(i=>dd(i.first,today)>=7),activ=elAct.filter(i=>firstWeekFoods(i)>=5).length;
  // ¿siguen apuntando? % de bebés con algo apuntado en la semana k desde que empezaron
  const ret=[];for(let k=1;k<=8;k++){const el=started.filter(i=>dd(i.first,today)>=(k+1)*7);ret.push(el.length>=3?pct(el.filter(i=>i.ds.some(d=>{const x=dd(i.first,d);return x>=k*7&&x<(k+1)*7})).length,el.length):null)}
  const r4=started.filter(i=>dd(i.first,today)>=35),r4ok=r4.filter(i=>i.ds.some(d=>{const x=dd(i.first,d);return x>=28&&x<35})).length;
  const nf=i=>i.foods.size;
  const fun=[["Cuentas",users.length],["Con bebé",real.length],["Han empezado",N],["5+ alimentos",started.filter(i=>nf(i)>=5).length],["20+ alimentos",started.filter(i=>nf(i)>=20).length],["50+ alimentos",started.filter(i=>nf(i)>=50).length],["100 alimentos",started.filter(i=>nf(i)>=100).length]];
  const funnel=fun.map(([k,v],j)=>`<div class="fn"${tip(`${k}: ${v} (${pct(v,fun[0][1])} % de las cuentas)`)}><span>${k}</span><span class="fb"><i class="s1" style="width:${Math.max(1.5,v*100/Math.max(1,fun[0][1]))}%"></i></span><b>${v}</b><em>${j?pct(v,fun[j-1][1])+" %":""}</em></div>`).join("");

  document.querySelectorAll(".fdet").forEach(x=>x.remove());document.body.appendChild(o);document.body.style.overflow="hidden";o.scrollTop=0;
  o.querySelector(".fx").onclick=()=>{o.remove();if(!document.querySelector(".fdet"))document.body.style.overflow=""};
}
document.addEventListener("click",e=>{const f=e.target.closest("[data-food]");if(f){e.preventDefault();openFood(f.dataset.food)}});

// Tabla de alimentos ordenable
let FSORT="t",FALL=false;
function drawFoods(k){if(k)FSORT=k;const el=$("ftab");if(!el)return;const N=(window.__ST||{}).N||0,fs=[...(window.__FOODS||[])];
  if(!fs.length){el.innerHTML=EMPTY;return}
  const val=f=>FSORT==="k"?f.k:f[FSORT]??-1;fs.sort((a,b)=>FSORT==="k"?a.k.localeCompare(b.k):val(b)-val(a)||b.t-a.t);
  const show=FALL?fs:fs.slice(0,15),mt=Math.max(1,...fs.map(f=>f.t)),ok=f=>f.n>=3;
  const th=(key,lab,cls="")=>`<th class="srt ${cls}${FSORT===key?" on":""}" data-s="${key}">${lab}${FSORT===key?" ↓":""}</th>`;
  el.innerHTML=`<div class="fsort">Ordenar: ${[["t","Probado"],["love","Le encanta"],["bad","No o poco"],["n","Valoraciones"],["k","A-Z"]].map(([k,l])=>`<button class="${FSORT===k?"on":""}" data-s="${k}">${l}</button>`).join("")}</div><table class="dt ft">
    <tr>${th("k","Alimento")}${th("t","Lo han probado")}${th("love","Le encanta","r")}${th("bad","No o poco","r")}${th("n","Valoraciones","r")}<th></th></tr>
    ${show.map(f=>`<tr class="frow" data-food="${esc(f.k)}"${tip(`${f.k}: probado por ${f.t} de ${N} bebés · ${f.n} valoraciones de ${f.rb} bebés${ok(f)?` · le encanta ${f.love} % · no o poco ${f.bad} %`:""}`)}><td class="fc"><span class="fic">${fi(f.k)}</span><b>${esc(f.k)}</b></td>
      <td><span class="ib"><i class="s1" style="width:${f.t*100/mt}%"></i></span> ${f.t} <small>(${pct(f.t,N)} %)</small></td>
      <td class="r">${ok(f)?`<span class="pill s1">${f.love} %</span>`:'<span class="mute">—</span>'}</td>
      <td class="r">${ok(f)?`<span class="pill s2">${f.bad} %</span>`:'<span class="mute">—</span>'}</td>
      <td class="r">${f.n} <small>· ${f.rb} bebés</small></td><td class="r go">›</td></tr>`).join("")}</table>
    ${fs.length>15?`<button class="btn sm" id="fmore" style="margin-top:10px">${FALL?"Ver menos":`Ver los ${fs.length}`}</button>`:""}`;
  el.querySelectorAll("[data-s]").forEach(t=>t.onclick=()=>drawFoods(t.dataset.s));
  const m=$("fmore");if(m)m.onclick=()=>{FALL=!FALL;drawFoods()}}
// Tooltip: al pasar el ratón en ordenador; en el móvil, al tocar se abre una ventanita con ✕
(function(){const touch=matchMedia("(hover: none)").matches;const t=document.createElement("div");t.id="tip";document.body.appendChild(t);
  if(touch){const sh=document.createElement("div");sh.id="tipsh";sh.innerHTML='<p></p><button aria-label="Cerrar">✕</button>';document.body.appendChild(sh);
    const close=()=>sh.classList.remove("on");sh.querySelector("button").onclick=close;
    document.addEventListener("click",e=>{if(e.target.closest("#tipsh"))return;const el=e.target.closest("[data-tip]");if(!el||el.closest("[data-food]")){close();return}sh.querySelector("p").textContent=el.dataset.tip;sh.classList.add("on");
      if(el.classList.contains("hit")){const xh=el.ownerSVGElement.querySelector(".xh");xh.setAttribute("x1",el.dataset.x);xh.setAttribute("x2",el.dataset.x);document.querySelectorAll(".lc .xh.on").forEach(x=>x.classList.remove("on"));xh.classList.add("on")}});return}
  document.addEventListener("pointermove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");
    document.querySelectorAll(".lc .xh.on").forEach(x=>{if(!el||!el.closest("svg")||el.closest("svg")!==x.ownerSVGElement)x.classList.remove("on")});
    if(!el){t.style.opacity=0;return}t.textContent=el.dataset.tip;t.style.opacity=1;
    const r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;t.style.transform=`translate(${x}px,${y}px)`;
    if(el.classList.contains("hit")){const xh=el.ownerSVGElement.querySelector(".xh");xh.setAttribute("x1",el.dataset.x);xh.setAttribute("x2",el.dataset.x);xh.classList.add("on")}});
  document.addEventListener("pointerleave",()=>t.style.opacity=0)})();

/* ---------- blog ---------- */
// Estados y cambios compartidos entre las dos (Firestore: blog/{slug}). La web los aplica al generar las páginas.
const EST={pendiente:["Por revisar",""],revisado:["Revisado","ok"],cambios:["Necesita cambios","warn"],pausa:["En pausa","off"],descartado:["Descartado","off"]};
const W="https://www.primerosalimentos.com";
let BL={cola:[],pub:[],ed:{}},EDOK=true;
const L2=v=>Array.isArray(v)?v.join("\n"):(v??"");
const toL=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
async function renderBlog(){
  const get=async u=>new DOMParser().parseFromString(await (await fetch(u,{cache:"no-store"})).text(),"text/html");
  try{const [cs,bp]=await Promise.all([getDocs(collection(db,"borradores")),get(W+"/blog/")]);
    BL.cola=cs.docs.map(d=>d.data()).sort((a,b)=>(a.n??999)-(b.n??999));BL.h={};BL.cola.forEach(a=>{BL.h[a.slug]=a.h;delete a.h});BL.pub=[...bp.querySelectorAll("a.card[href*='/blog/']")].map(a=>({slug:a.getAttribute("href").split("/").filter(Boolean).pop(),t:(a.querySelector("h2")||a).textContent.trim(),url:a.getAttribute("href")}))}
  catch(e){$("t-blog").innerHTML=e&&e.code==="permission-denied"?'<div class="card warn">Para ver los borradores falta añadir la colección <b>borradores</b> a las reglas de Firestore.</div>':'<p class="mute">No se ha podido cargar la lista del blog.</p>';return}
  try{const s=await getDocs(collection(db,"blog"));BL.ed={};s.forEach(d=>BL.ed[d.id]=d.data());EDOK=true}catch(e){EDOK=false}
  drawBlog()}
function drawBlog(){
  const row=a=>{const e=BL.ed[a.slug]||{},st=e.estado||a.fuera||"pendiente",ch=Object.keys(e.cambios||{}).length;
    return `<tr><td><button class="lnk" data-ed="${esc(a.slug)}">${esc((e.cambios||{}).title||a.t)}</button>${ch?` <span class="chip">Editado</span>`:""}<div class="mute sm">${a.cat==="receta"?"Receta":"Guía"}${e.por?` · ${esc(e.por.split("@")[0])}, ${e.at&&e.at.toDate?e.at.toDate().toLocaleDateString("es-ES",{day:"numeric",month:"short"}):""}`:""}${e.nota?` · <i>${esc(e.nota)}</i>`:""}</div></td>
      <td class="mute">${esc(a.d||"No se publica")}</td>
      <td><select class="st st-${EST[st]?EST[st][1]:""}" data-st="${esc(a.slug)}" ${EDOK?"":"disabled"}>${Object.entries(EST).map(([k,[l]])=>`<option value="${k}"${k===st?" selected":""}>${l}</option>`).join("")}</select></td>
      <td><button class="lnk sm" data-pv="${esc(a.slug)}">Ver</button></td></tr>`};
  const n=k=>BL.cola.filter(a=>((BL.ed[a.slug]||{}).estado||"pendiente")===k).length;
  $("t-blog").innerHTML=`${EDOK?"":`<div class="card warn" style="margin-bottom:12px">Para guardar estados y cambios falta añadir la colección <b>blog</b> a las reglas de Firestore.</div>`}
    <p class="mute">Se publica uno cada dos días, en este orden. Los que están <b>en pausa</b> o <b>descartados</b> se saltan. Toca un título para editarlo.</p>
    <div class="grid" style="margin-bottom:12px">${kpi(BL.cola.filter(a=>!a.fuera).length,"En cola")}${kpi(n("revisado"),"Revisados")}${kpi(n("cambios"),"Necesitan cambios")}${kpi(n("pausa")+n("descartado"),"Apartados")}</div>
    <div class="card"><h2>Borradores · ${BL.cola.length}</h2><table class="bt"><tr><th>Artículo</th><th>Fecha</th><th>Estado</th><th></th></tr>${BL.cola.map(row).join("")}</table></div>
    <div class="card" style="margin-top:14px"><h2>Publicados · ${BL.pub.length}</h2><table>${BL.pub.map(a=>`<tr><td><a href="${a.url}" target="_blank" rel="noopener">${esc(a.t)}</a></td></tr>`).join("")}</table></div>`;
  $("t-blog").querySelectorAll("[data-st]").forEach(s=>s.onchange=async()=>{const k=s.dataset.st,e=BL.ed[k]||{};s.disabled=true;
    try{await saveEd(k,{...e,estado:s.value});drawBlog()}catch(err){alert("No se ha podido guardar: "+(err.code||err.message));s.disabled=false}});
  $("t-blog").querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>openEd(b.dataset.ed));
}
// Vista previa del borrador (el HTML vive en Firestore, no en la web pública)
document.addEventListener("click",e=>{const b=e.target.closest("[data-pv]");if(!b)return;e.preventDefault();const h=(BL.h||{})[b.dataset.pv];
  if(!h){alert("Aún no hay vista previa de este artículo.");return}const u=URL.createObjectURL(new Blob([h],{type:"text/html"}));window.open(u,"_blank","noopener");setTimeout(()=>URL.revokeObjectURL(u),60000)});
async function saveEd(slug,e){const u=auth.currentUser;const d={estado:e.estado||"pendiente",cambios:e.cambios||{},nota:e.nota||"",por:u.email||"",at:serverTimestamp()};
  await setDoc(doc(db,"blog",slug),d);BL.ed[slug]={...d,at:{toDate:()=>new Date()}}}
function openEd(slug){
  const a=BL.cola.find(x=>x.slug===slug);if(!a)return;const src=a.a||{},e=BL.ed[slug]||{},c={...(e.cambios||{})},v=k=>k in c?c[k]:src[k];const rec=a.cat==="receta";
  const F=(k,lab,type="text",help="")=>k in src||k==="short"?`<label class="fl"><span>${lab}${help?` <small class="mute">${help}</small>`:""}</span>${type==="area"||type==="list"?`<textarea data-k="${k}" data-t="${type}" rows="${type==="list"?Math.max(3,(src[k]||[]).length+1):3}">${esc(type==="list"?L2(v(k)):v(k))}</textarea>`:`<input data-k="${k}" data-t="${type}" type="${type==="num"?"number":"text"}" value="${esc(v(k))}">`}</label>`:"";
  const faq=(v("faq")||[]);
  const o=document.createElement("div");o.className="edov";o.innerHTML=`<div class="edc">
    <div class="edh"><div><h2 style="margin:0">${rec?"Receta":"Guía"} · ${esc(a.d||"no se publica")}</h2><button class="lnk sm" data-pv="${esc(slug)}">Ver la página</button></div><button class="btn sm" data-x>Cerrar</button></div>
    <label class="fl"><span>Estado</span><select data-k="estado">${Object.entries(EST).map(([k,[l]])=>`<option value="${k}"${k===(e.estado||"pendiente")?" selected":""}>${l}</option>`).join("")}</select></label>
    ${F("title","Título")}${F("short","Título corto","text","para las tarjetas")}${F("desc","Descripción","area","la que sale en Google · <b data-cnt></b>")}${F("lead","Entradilla","area")}
    ${rec?`<div class="g3">${F("age","Edad")}${F("prep","Preparación (min)","num")}${F("cook","Cocción (min)","num")}${F("yld","Raciones")}</div>${F("alg","Alérgenos","list","uno por línea")}${F("ing","Ingredientes","list","uno por línea")}${F("steps","Pasos","list","uno por línea")}${F("serve","Cómo servirlo","list","uno por línea")}${F("keep","Conservación","area")}`:""}
    ${"body" in src?`<label class="fl"><span>Texto</span></label><div class="tb"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="h2">Subtítulo</button><button type="button" data-cmd="p">Párrafo</button><button type="button" data-cmd="ul">• Lista</button><button type="button" data-cmd="link">Enlace</button></div><div class="rich" contenteditable="true" data-k="body">${v("body")}</div>`:""}
    ${"faq" in src?`<label class="fl"><span>Preguntas frecuentes</span></label><div id="faqs">${faq.map(([q,r])=>fq(q,r)).join("")}</div><button type="button" class="btn sm" data-addq>Añadir pregunta</button>`:""}
    <label class="fl"><span>Nota interna <small class="mute">solo la veis vosotras</small></span><input data-k="nota" value="${esc(e.nota||"")}"></label>
    <p class="mute sm">Los cambios se guardan para las dos y se aplican a la página al publicarse. Si escribes en <b>negrita</b> o enlaces en las listas, se mantienen.</p>
    <div class="edf"><button class="btn sm" data-reset ${Object.keys(c).length?"":"disabled"}>Volver al original</button><span style="flex:1"></span><button class="btn" data-x>Cancelar</button><button class="btn pri" data-save>Guardar</button></div></div>`;
  document.body.appendChild(o);document.body.style.overflow="hidden";
  const close=()=>{o.remove();document.body.style.overflow=""};
  o.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
  const cnt=()=>{const d=o.querySelector('[data-k="desc"]'),b=o.querySelector("[data-cnt]");if(d&&b){b.textContent=d.value.length+" caracteres"+(d.value.length>160?" (mejor menos de 160)":"")}};cnt();o.querySelector('[data-k="desc"]')?.addEventListener("input",cnt);
  o.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{const k=b.dataset.cmd;o.querySelector(".rich").focus();
    if(k==="bold")document.execCommand("bold");else if(k==="h2")document.execCommand("formatBlock",false,"h2");else if(k==="p")document.execCommand("formatBlock",false,"p");else if(k==="ul")document.execCommand("insertUnorderedList");
    else if(k==="link"){const u=prompt("Enlace (https://…)");if(u)document.execCommand("createLink",false,u)}});
  o.querySelector("[data-addq]")?.addEventListener("click",()=>{o.querySelector("#faqs").insertAdjacentHTML("beforeend",fq("",""))});
  o.addEventListener("click",ev=>{const r=ev.target.closest("[data-rmq]");if(r)r.closest(".fq").remove()});
  o.querySelector("[data-reset]").onclick=async()=>{if(!confirm("¿Quitar todos los cambios de este artículo y volver al texto original?"))return;await saveEd(slug,{...e,cambios:{}});close();drawBlog()};
  o.querySelector("[data-save]").onclick=async ev=>{const b=ev.target;b.disabled=true;b.textContent="Guardando…";
    const nc={},same=(x,y)=>JSON.stringify(x??"")===JSON.stringify(y??"");
    o.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(k==="estado"||k==="nota")return;let val;
      if(k==="body")val=el.innerHTML;else if(el.dataset.t==="list")val=toL(el.value);else if(el.dataset.t==="num")val=el.value===""?null:+el.value;else val=el.value.trim();
      if(k==="body"&&same(val.replace(/\s+/g," "),String(src.body||"").replace(/\s+/g," ")))return;
      if(!same(val,src[k])&&!(k==="short"&&!src.short&&!val))nc[k]=val});
    if("faq" in src){const fs=[...o.querySelectorAll(".fq")].map(x=>[x.querySelector("input").value.trim(),x.querySelector("textarea").value.trim()]).filter(x=>x[0]&&x[1]);if(!same(fs,src.faq))nc.faq=fs}
    try{await saveEd(slug,{estado:o.querySelector('[data-k="estado"]').value,cambios:nc,nota:o.querySelector('[data-k="nota"]').value.trim()});close();drawBlog()}
    catch(err){b.disabled=false;b.textContent="Guardar";alert("No se ha podido guardar: "+(err.code||err.message))}};
}
const fq=(q,r)=>`<div class="fq"><input placeholder="Pregunta" value="${esc(q)}"><textarea rows="2" placeholder="Respuesta">${esc(r)}</textarea><button type="button" class="btn sm" data-rmq>Quitar</button></div>`;
</script>
