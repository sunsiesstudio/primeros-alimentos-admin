<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Primeros Alimentos</title>
<link rel="icon" href="https://app.primerosalimentos.com/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eeead8;--card:#f7f4e8;--ink:#262626;--mute:#6b6a5c;--line:#d8d3bc;--green:#4a8760;--terra:#c96a47;--acc:#3e4cd0;--onacc:#fff;--bar:#4a8760;--bar2:#c96a47;--soft:color-mix(in srgb,var(--green) 12%,var(--card));color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121232;--card:#1e1d46;--ink:#f1f0ff;--mute:#aeacd8;--line:#36356e;--green:#efeeff;--terra:#ffa77c;--acc:#a29dff;--onacc:#15143a;--bar:#a29dff;--bar2:#ffa77c;--soft:color-mix(in srgb,var(--acc) 14%,var(--card));color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.45 Montserrat,system-ui,sans-serif}
.disp,h1,h2{font-family:"Luckiest Guy","Arial Rounded MT Bold",system-ui,sans-serif;font-weight:400;letter-spacing:.03em;margin:0}
h2{font-size:1.15rem;color:var(--green);margin-bottom:12px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 20px 0;text-align:center}
header .top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
header .logo{width:230px;height:auto}
header .who{font-size:.8rem;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;max-width:1100px;margin:6px auto 0;border-bottom:1px solid var(--line)}
nav button{flex:1;min-height:46px;padding:8px 4px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mute);font:700 15px Montserrat,sans-serif;cursor:pointer;margin-bottom:-1px}
nav button.on{color:var(--terra);border-bottom-color:var(--terra)}
@media (prefers-color-scheme:dark){nav button.on{color:var(--acc);border-bottom-color:var(--acc)}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 20px;border-radius:999px;border:2px solid var(--acc);background:transparent;color:var(--acc);font:700 14px Montserrat,sans-serif;cursor:pointer}
.btn.pri{background:var(--terra);border-color:var(--terra);color:var(--onacc)}
.btn.sm{min-height:34px;padding:4px 14px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:20px 20px 60px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.kpi b{display:block;font:400 2rem/1.1 "Luckiest Guy",system-ui;color:var(--green);letter-spacing:.02em}
.kpi span{display:block;font-weight:700;font-size:.85rem;margin-top:4px}
.kpi small{display:block;color:var(--mute);font-size:.75rem;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:minmax(90px,32%) 1fr minmax(48px,auto);gap:8px;align-items:center;font-size:13px;font-weight:600}
.row .tr{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.row .tr i{display:block;height:100%;background:var(--bar);border-radius:99px}
.row.alt .tr i{background:var(--bar2)}
.row em{font-style:normal;text-align:right;color:var(--mute);font-weight:500}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);font-weight:600}
.cols i{display:block;width:100%;max-width:34px;background:var(--bar);border-radius:10px 10px 4px 4px;min-height:3px}
.mute{color:var(--mute)}
.ideas{padding-left:0;list-style:none;margin:0}
.ideas li{background:var(--soft);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.center{min-height:72vh;display:grid;place-items:center;text-align:center;padding:20px}
.center .card{max-width:440px;padding:26px 24px}
.center .logo{width:min(360px,90%);margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
a{color:var(--acc);font-weight:600}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--green)}
.hide{display:none!important}
#err{margin:14px 0 0;color:var(--terra);font-weight:600}
@media (max-width:640px){header .logo{width:170px}main{padding:14px 12px 50px}nav button{font-size:13px}}
.lnk{background:none;border:0;padding:0;color:var(--acc);font:700 14.5px Montserrat,sans-serif;text-align:left;cursor:pointer;text-decoration:underline}
.sm{font-size:12.5px}.chip.ok{background:color-mix(in srgb,var(--green) 18%,var(--card))}
select{font:600 13px Montserrat,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;min-height:38px}
select.st-ok{border-color:var(--green);color:var(--green)}select.st-warn{border-color:var(--terra);color:var(--terra)}select.st-off{opacity:.6}
.card.warn{border-color:var(--terra);color:var(--terra);font-weight:600}
.edov{position:fixed;inset:0;z-index:20;background:rgba(10,10,30,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 12px}
.edc{background:var(--card);border-radius:22px;width:min(820px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.edh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.fl{display:block;margin:12px 0 0}.fl>span{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
.fl input,.fl textarea,.fl select,.fq input,.fq textarea{width:100%;font:500 14.5px/1.5 Montserrat,sans-serif;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px}
.fl textarea,.fq textarea{resize:vertical}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}.tb button{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font:600 13px Montserrat,sans-serif;cursor:pointer}
.rich{min-height:260px;max-height:60vh;overflow:auto;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:6px 14px;line-height:1.6}.rich:focus{outline:2px solid var(--acc)}
.rich h2{font:700 1.1rem Montserrat,sans-serif;letter-spacing:0;color:var(--ink);margin:14px 0 6px}.rich table{font-size:13px}
.fq{display:grid;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:8px}.fq .btn{justify-self:start}
.edf{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--card);padding:10px 0}
.sech{font:400 1.2rem "Luckiest Guy",system-ui;letter-spacing:.03em;color:var(--terra);margin:26px 0 10px}
.row em{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div class="top"><span class="who">Admin</span><svg class="logo" viewBox="0 0 640 215" role="img" aria-label="Primeros alimentos"><defs><path id="ARC1" d="M10,185 Q320,10 630,185"/></defs><text class="disp" text-anchor="middle" style="font-size:56px;fill:var(--green)"><textPath href="#ARC1" startOffset="50%">Primeros alimentos</textPath></text><g transform="translate(279 112) scale(3.4)" style="fill:var(--terra)"><polygon points="12,1.5 14.9,8.4 22.4,9.1 16.7,14 18.4,21.4 12,17.5 5.6,21.4 7.3,14 1.6,9.1 9.1,8.4"/><path d="M9.3 11.2v.9M14.7 11.2v.9M9.8 13.4q2.2 1.9 4.4 0" style="stroke:var(--bg);fill:none;stroke-width:.9;stroke-linecap:round"/></g></svg><button id="out" class="btn sm hide">Salir</button><span id="sp" class="who" style="visibility:hidden">Admin</span></div>
  <nav id="nav" class="hide">
    <button data-t="uso" class="on">Uso</button>
    <button data-t="bebes">Qué comen</button>
    <button data-t="redes">Ideas</button>
    <button data-t="blog">Blog</button>
  </nav>
</header>

<div id="login" class="center"><div class="card">
  <h2>Panel de control</h2>
  <p class="mute">Inicia sesión para ver cómo va la app.</p>
  <button id="in" class="btn pri">Iniciar sesión con Google</button>
  <p id="err" class="mute"></p>
</div></div>

<main id="app" class="hide">
  <p id="upd" class="mute"></p>
  <section id="t-uso"></section>
  <section id="t-bebes" class="hide"></section>
  <section id="t-redes" class="hide"></section>
  <section id="t-blog" class="hide"></section>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyBS8bb9UlOaOCJE92cpWE4nAqIFDuerypQ",authDomain:"primeros-alimentos.firebaseapp.com",projectId:"primeros-alimentos",appId:"1:210048481917:web:f7a4e8f31d067a7152cf14"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MIN=5; // con menos familias no se enseñan porcentajes de un grupo, para que nadie sea identificable

const AGD={gluten:["Avena","Bebida de avena","Cebada","Centeno","Cuscús","Espelta","Harina de trigo","Pan","Pasta","Sémola de trigo"],huevo:["Huevo"],pescado:["Bacalao","Boquerones","Caballa","Dorada","Gallo","Jurel","Lenguado","Lubina","Merluza","Pescadilla","Rape","Rodaballo","Salmón","Sardinas","Trucha"],crustaceos:["Gambas"],moluscos:["Calamar","Mejillones","Pulpo","Sepia"],cacahuete:["Cacahuete"],frutoscascara:["Almendra","Anacardo","Avellana","Macadamia","Nuez","Nuez de Brasil","Nuez pecana","Pistacho"],sesamo:["Sésamo (tahini)"],soja:["Edamame","Tofu","Tempeh","Bebida de soja","Yogur de soja"],apio:["Apio"],legumbres:["Lentejas","Garbanzos","Alubias blancas","Alubias negras","Alubias pintas","Guisantes","Habas tiernas"],lacteos:["Kéfir","Mantequilla","Mozzarella","Queso de cabra","Queso fresco","Queso tierno","Requesón","Ricotta","Yogur griego","Yogur natural"]};
const AGN={gluten:"Gluten",huevo:"Huevo",pescado:"Pescado",crustaceos:"Crustáceos",moluscos:"Moluscos",cacahuete:"Cacahuete",frutoscascara:"Frutos secos",sesamo:"Sésamo",soja:"Soja",apio:"Apio",legumbres:"Legumbres",lacteos:"Lácteos"};
const STY={pure:"Purés",grum:"Purés con grumos",grad:"Poco a poco",blw:"BLW",mix:"Mixto","":"Sin elegir"};
const DAY=864e5,today=new Date().toISOString().slice(0,10);
const dd=(a,b)=>Math.round((new Date(b)-new Date(a))/DAY);
const months=(bd,d)=>bd?Math.floor(dd(bd,d)/30.44):null;
const pct=(a,b)=>b?Math.round(a*100/b):0;

/* ---------- pestañas ---------- */
$("nav").onclick=e=>{const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ["uso","bebes","redes","blog"].forEach(k=>$("t-"+k).classList.toggle("hide",k!==t));$("upd").classList.toggle("hide",t==="blog");
  try{localStorage.setItem("adm_tab",t)}catch(e){}};

/* ---------- entrar ---------- */
$("in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$("err").textContent="No se ha podido entrar: "+e.code);
$("out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  $("login").classList.toggle("hide",!!u);$("app").classList.toggle("hide",!u);$("nav").classList.toggle("hide",!u);$("out").classList.toggle("hide",!u);$("sp").classList.toggle("hide",!!u);
  if(!u)return;
  $("upd").textContent="Cargando datos…";
  try{const snap=await getDocs(collection(db,"users"));try{render(snap.docs.map(d=>{const x=d.data();return x.fam?{...x,babies:[]}:x}))}catch(re){console.error(re);$("t-uso").innerHTML=`<div class="card">Hay datos con un formato que no esperaba: ${esc(re.message)}</div>`}
    $("upd").textContent=`Datos de ${snap.size} cuentas · ${new Date().toLocaleString("es-ES")} · Lectura de Firestore: ${snap.size} documentos`;}
  catch(e){$("upd").textContent="";$("app").classList.add("hide");$("nav").classList.add("hide");$("login").classList.remove("hide");
    $("err").innerHTML=e.code==="permission-denied"?`La cuenta <b>${esc(u.email)}</b> no tiene acceso a los datos. Revisa las reglas de Firestore.`:"Error al leer los datos: "+esc(e.code||e.message);}
  renderBlog();
  try{const t=(location.hash||"").slice(1)||localStorage.getItem("adm_tab");if(t)document.querySelector(`#nav [data-t="${t}"]`)?.click()}catch(e){}
});

/* ---------- piezas de UI ---------- */
const kpi=(v,l,s)=>`<div class="card kpi"><b>${v}</b><span>${l}</span>${s?`<small>${s}</small>`:""}</div>`;
const bars=(title,rows,{alt=false,suf="",note=""}={})=>{const mx=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="card"><h2>${title}</h2>${note?`<p class="mute">${note}</p>`:""}<div class="bars">${rows.length?rows.map(([k,v,lab])=>`<div class="row${alt?" alt":""}"><span>${esc(k)}</span><span class="tr"><i style="width:${v*100/mx}%"></i></span><em>${lab??v+suf}</em></div>`).join(""):'<p class="mute">Aún no hay datos suficientes.</p>'}</div></div>`};
const cols=(title,rows,note)=>{const mx=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="card"><h2>${title}</h2>${note?`<p class="mute">${note}</p>`:""}<div class="cols">${rows.map(([k,v])=>`<div><span>${v}</span><i style="height:${v*110/mx}px"></i><span>${esc(k)}</span></div>`).join("")}</div></div>`};

/* ---------- cálculos ---------- */
function render(users){
  const babies=[];
  users.forEach(u=>(u.babies||[]).forEach(b=>babies.push({...b,_ts:u.ts||0})));
  const real=babies.filter(b=>(Array.isArray(b.log)?b.log:[]).some(l=>l&&!l.pre)||(b.nm||"").trim());
  const now=Date.now();
  const act7=users.filter(u=>u.ts&&now-u.ts<7*DAY).length,act30=users.filter(u=>u.ts&&now-u.ts<30*DAY).length;

  // primer y último día con registro por bebé
  const info=real.map(b=>{const L=(Array.isArray(b.log)?b.log:[]).filter(l=>l&&l.f&&l.d&&!l.pre);const ds=L.map(l=>l.d).sort();
    const first=ds[0]||null,last=ds[ds.length-1]||null;
    const foods=new Set(L.map(l=>l.f));
    const firstWeek=first?new Set(L.filter(l=>dd(first,l.d)<7).map(l=>l.f)).size:0;
    const w4=first&&dd(first,today)>=28?L.some(l=>{const x=dd(first,l.d);return x>=21&&x<35}):null;
    return {b,L,first,last,foods,firstWeek,w4,mo:months(b.bd,today)}});
  const started=info.filter(i=>i.first);
  const actv=started.filter(i=>i.firstWeek>=5).length;
  const elig=started.filter(i=>i.w4!==null),ret=elig.filter(i=>i.w4).length;

  // nuevas por semana (primer registro), últimas 10 semanas
  const wk=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(5,10)};
  const weeks=[];for(let i=9;i>=0;i--){const x=new Date(now-i*7*DAY);weeks.push(wk(x.toISOString().slice(0,10)))}
  const newW=weeks.map(w=>[w.split("-").reverse().join("/"),started.filter(i=>wk(i.first)===w).length]);

  // edad
  const ageB={"<6":0,"6 m":0,"7 m":0,"8 m":0,"9 m":0,"10 m":0,"11 m":0,"12-17 m":0,"18+ m":0};
  real.forEach(b=>{const m=months(b.bd,today);if(m==null)return;const k=m<6?"<6":m<12?m+" m":m<18?"12-17 m":"18+ m";ageB[k]++});
  const sty={};real.forEach(b=>{const k=STY[(b.prefs||{}).sty||""]||"Otro";sty[k]=(sty[k]||0)+1});
  const pais={};real.forEach(b=>{const k=b.pais||"ES";pais[k]=(pais[k]||0)+1});

  $("t-uso").innerHTML=`<div class="grid">
    ${kpi(users.length,"Cuentas")}
    ${kpi(real.length,"Bebés con datos")}
    ${kpi(act7,"Activas en 7 días",pct(act7,users.length)+" % de las cuentas")}
    ${kpi(act30,"Activas en 30 días")}
    ${kpi(started.length?pct(actv,started.length)+" %":"—","Activación","5 alimentos o más la primera semana · objetivo 50 %")}
    ${kpi(elig.length?pct(ret,elig.length)+" %":"—","Retención semana 4",elig.length+" bebés con 4 semanas o más · objetivo 30 %")}
  </div>
  <div class="g2">
    ${cols("Familias nuevas por semana",newW,"Por la semana de su primer alimento apuntado.")}
    ${bars("Edad de los bebés (meses)",Object.entries(ageB))}
    ${bars("Cómo comen",Object.entries(sty).sort((a,b)=>b[1]-a[1]))}
    ${bars("País",Object.entries(pais).sort((a,b)=>b[1]-a[1]),{alt:true})}
  </div>`;

  // ---------- qué comen ----------
  const tried={},love={},bad={},rated={},firstAge={},ratedB={};
  started.forEach(i=>{const seen=new Set();i.L.forEach(l=>{if(!seen.has(l.f)){seen.add(l.f);tried[l.f]=(tried[l.f]||0)+1;
      if(i.b.bd){const m=months(i.b.bd,l.d);if(m!=null&&m>=4&&m<=24)(firstAge[l.f]=firstAge[l.f]||[]).push(m)}}
    if(["love","ok","meh","no"].includes(l.r)){rated[l.f]=(rated[l.f]||0)+1;(ratedB[l.f]=ratedB[l.f]||new Set()).add(i);if(l.r==="love")love[l.f]=(love[l.f]||0)+1;if(l.r==="meh"||l.r==="no")bad[l.f]=(bad[l.f]||0)+1}})});
  const N=started.length;
  const topT=Object.entries(tried).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([k,v])=>[k,v,`${pct(v,N)} % · ${v} de ${N} bebés`]);
  const ratio=(o)=>Object.entries(o).filter(([k])=>(rated[k]||0)>=3).map(([k,v])=>[k,pct(v,rated[k]),`${pct(v,rated[k])} % · ${v} de ${rated[k]} · ${ratedB[k].size} bebés`,rated[k]]).sort((a,b)=>b[1]-a[1]||b[3]-a[3]).slice(0,15);
  const algT=Object.entries(AGD).map(([g,fs])=>{const n=started.filter(i=>fs.some(f=>i.foods.has(f))).length;return [AGN[g],n,`${pct(n,N)} % · ${n} de ${N} bebés`]}).sort((a,b)=>b[1]-a[1]);
  const rxG={};real.forEach(b=>(Array.isArray(b.rx)?b.rx:[]).forEach(r=>{if(!r)return;const k=AGN[r.g]||r.f||r.g||"Otro";rxG[k]=(rxG[k]||0)+1}));
  const alG={},alS={};real.forEach(b=>{const al=b.al&&typeof b.al==="object"?b.al:{};Object.entries(Array.isArray(al)?Object.fromEntries(al.map(x=>[x,"alergia"])):al).forEach(([g,v])=>{const k=AGN[g]||g;if(v==="alergia")alG[k]=(alG[k]||0)+1;else if(v==="sospecha")alS[k]=(alS[k]||0)+1})});
  // cacas: días con dato
  let ccDays=0,ccSum=0,cc0=0;real.forEach(b=>Object.values(b.dn&&typeof b.dn==="object"?b.dn:{}).forEach(v=>{if(!v||!Array.isArray(v.t))return;
    const n=v.t.includes("nocaca")?0:(v.cc||(v.t.includes("caca")?1:null));if(n==null)return;ccDays++;ccSum+=n;if(n===0)cc0++}));
  const avgFoods=N?Math.round(started.reduce((s,i)=>s+i.foods.size,0)/N):0;
  const med=a=>{a=[...a].sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};

  $("t-bebes").innerHTML=`<p class="mute">Todo en agregado y anónimo. En cada gráfica: el porcentaje, cuántos casos hay detrás y de cuántos bebés.</p>
  <div class="grid">
    ${kpi(N,"Bebés que ya han empezado")}
    ${kpi(avgFoods,"Alimentos distintos de media")}
    ${kpi(ccDays?(ccSum/ccDays).toFixed(1):"—","Cacas al día de media",ccDays?`${ccDays} días apuntados · ${pct(cc0,ccDays)} % sin caca`:"")}

    <div class="edh"><div><h2 style="margin:0">${rec?"Receta":"Guía"} · ${esc(a.d||"no se publica")}</h2><a class="sm" href="${W}/borradores/${esc(slug)}/" target="_blank" rel="noopener">Ver la página</a></div><button class="btn sm" data-x>Cerrar</button></div>
    <label class="fl"><span>Estado</span><select data-k="estado">${Object.entries(EST).map(([k,[l]])=>`<option value="${k}"${k===(e.estado||"pendiente")?" selected":""}>${l}</option>`).join("")}</select></label>
    ${F("title","Título")}${F("short","Título corto","text","para las tarjetas")}${F("desc","Descripción","area","la que sale en Google · <b data-cnt></b>")}${F("lead","Entradilla","area")}
    ${rec?`<div class="g3">${F("age","Edad")}${F("prep","Preparación (min)","num")}${F("cook","Cocción (min)","num")}${F("yld","Raciones")}</div>${F("alg","Alérgenos","list","uno por línea")}${F("ing","Ingredientes","list","uno por línea")}${F("steps","Pasos","list","uno por línea")}${F("serve","Cómo servirlo","list","uno por línea")}${F("keep","Conservación","area")}`:""}
    ${"body" in src?`<label class="fl"><span>Texto</span></label><div class="tb"><button type="button" data-cmd="bold"><b>B</b></button><button type="button" data-cmd="h2">Subtítulo</button><button type="button" data-cmd="p">Párrafo</button><button type="button" data-cmd="ul">• Lista</button><button type="button" data-cmd="link">Enlace</button></div><div class="rich" contenteditable="true" data-k="body">${v("body")}</div>`:""}
    ${"faq" in src?`<label class="fl"><span>Preguntas frecuentes</span></label><div id="faqs">${faq.map(([q,r])=>fq(q,r)).join("")}</div><button type="button" class="btn sm" data-addq>Añadir pregunta</button>`:""}
    <label class="fl"><span>Nota interna <small class="mute">solo la veis vosotras</small></span><input data-k="nota" value="${esc(e.nota||"")}"></label>
    <p class="mute sm">Los cambios se guardan para las dos y se aplican a la página al publicarse. Si escribes en <b>negrita</b> o enlaces en las listas, se mantienen.</p>
    <div class="edf"><button class="btn sm" data-reset ${Object.keys(c).length?"":"disabled"}>Volver al original</button><span style="flex:1"></span><button class="btn" data-x>Cancelar</button><button class="btn pri" data-save>Guardar</button></div></div>`;
  document.body.appendChild(o);document.body.style.overflow="hidden";
  const close=()=>{o.remove();document.body.style.overflow=""};
  o.querySelectorAll("[data-x]").forEach(b=>b.onclick=close);
  const cnt=()=>{const d=o.querySelector('[data-k="desc"]'),b=o.querySelector("[data-cnt]");if(d&&b){b.textContent=d.value.length+" caracteres"+(d.value.length>160?" (mejor menos de 160)":"")}};cnt();o.querySelector('[data-k="desc"]')?.addEventListener("input",cnt);
  o.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{const k=b.dataset.cmd;o.querySelector(".rich").focus();
    if(k==="bold")document.execCommand("bold");else if(k==="h2")document.execCommand("formatBlock",false,"h2");else if(k==="p")document.execCommand("formatBlock",false,"p");else if(k==="ul")document.execCommand("insertUnorderedList");
    else if(k==="link"){const u=prompt("Enlace (https://…)");if(u)document.execCommand("createLink",false,u)}});
  o.querySelector("[data-addq]")?.addEventListener("click",()=>{o.querySelector("#faqs").insertAdjacentHTML("beforeend",fq("",""))});
  o.addEventListener("click",ev=>{const r=ev.target.closest("[data-rmq]");if(r)r.closest(".fq").remove()});
  o.querySelector("[data-reset]").onclick=async()=>{if(!confirm("¿Quitar todos los cambios de este artículo y volver al texto original?"))return;await saveEd(slug,{...e,cambios:{}});close();drawBlog()};
  o.querySelector("[data-save]").onclick=async ev=>{const b=ev.target;b.disabled=true;b.textContent="Guardando…";
    const nc={},same=(x,y)=>JSON.stringify(x??"")===JSON.stringify(y??"");
    o.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(k==="estado"||k==="nota")return;let val;
      if(k==="body")val=el.innerHTML;else if(el.dataset.t==="list")val=toL(el.value);else if(el.dataset.t==="num")val=el.value===""?null:+el.value;else val=el.value.trim();
      if(k==="body"&&same(val.replace(/\s+/g," "),String(src.body||"").replace(/\s+/g," ")))return;
      if(!same(val,src[k])&&!(k==="short"&&!src.short&&!val))nc[k]=val});
    if("faq" in src){const fs=[...o.querySelectorAll(".fq")].map(x=>[x.querySelector("input").value.trim(),x.querySelector("textarea").value.trim()]).filter(x=>x[0]&&x[1]);if(!same(fs,src.faq))nc.faq=fs}
    try{await saveEd(slug,{estado:o.querySelector('[data-k="estado"]').value,cambios:nc,nota:o.querySelector('[data-k="nota"]').value.trim()});close();drawBlog()}
    catch(err){b.disabled=false;b.textContent="Guardar";alert("No se ha podido guardar: "+(err.code||err.message))}};
}
const fq=(q,r)=>`<div class="fq"><input placeholder="Pregunta" value="${esc(q)}"><textarea rows="2" placeholder="Respuesta">${esc(r)}</textarea><button type="button" class="btn sm" data-rmq>Quitar</button></div>`;
</script>
</body>
</html>
